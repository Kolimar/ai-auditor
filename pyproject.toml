[project]
name = "ai-auditor"
version = "0.1.0"
description = "AI Workflow Optimization Auditor: static + runtime analysis of LLM agent systems to find where generative inference is unnecessary, oversized or unproven."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ai-auditor = "ai_auditor.cli.main:main"

[project.entry-points."ai_auditor.rules"]
# Third-party rule packs register here: name = "package.module"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
